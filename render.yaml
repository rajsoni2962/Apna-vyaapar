services:
  - type: web
    name: ashirwad-technologies-billing
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:/data/dev.db
    disk:
      name: billing-data
      mountPath: /data
      sizeGB: 1
