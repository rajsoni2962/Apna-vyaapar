name: Continuous Integration & Production Safeguards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-build:
    name: Security Tests & Build Verification
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: apna_vyaapar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Explicitly set to test environment - NEVER inject production database secrets
      NODE_ENV: test
      APP_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:testpassword123@localhost:5432/apna_vyaapar_test
      # Dummy session secret for testing
      SESSION_SECRET: ci-test-session-secret-key-do-not-use-in-production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Schema to Isolated Test Database
        run: npx prisma db push --schema=./prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Verify TypeScript Compilation
        run: npx tsc --noEmit

      - name: Run Production Safeguards & Security Audit Suite
        run: npx tsx scripts/verify_production_safeguards.ts
        env:
          # Verify that even if a production URL is accidentally injected, guards abort execution
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run Next.js Production Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
